<h1>Update student</h1>
<!-- <h1>{{ student.name }}</h1> -->
<form action="" method="POST">
    {% csrf_token %}
    <label for="">Name</label>
    <input type="text" name="name" value=" {{ student.name }}" >
    <br>

    <label for="">Roll</label>
    <input type="number" name="roll" readonly value="{{ student.roll }}">
    <br>

    <label for="">Markd</label>
    <input type="number" name="marks" value="{{ student.marks }}">
    <br>

    <label for="">Course</label>
    <input type="text" name="course" value="{{ student.course }}">
    <br>

    <label for="">Admission Type</label>
    <input type="text" name="admsnType" value="{{ student.admsnType }}" >
    <br>
    <button>update</button>

</form>
